# ============================================================
# OlivePress Backend - configuration par defaut (PostgreSQL)
# Lancer avec :  mvn spring-boot:run   (ou profil h2 pour le dev sans Postgres)
# ============================================================

# En local : 8091. Sur Render (ou autre PaaS) : la variable PORT impose le port d'ecoute.
server.port=${PORT:8091}
spring.application.name=olivepress-backend

# ---- Base de données ----
# Sans OLIVEPRESS_DB_URL (dev local) : H2 en mémoire, aucun serveur requis.
# Avec OLIVEPRESS_DB_URL (prod / Docker) : PostgreSQL.
spring.datasource.url=${OLIVEPRESS_DB_URL:jdbc:h2:mem:olivepress;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${OLIVEPRESS_DB_USER:sa}
spring.datasource.password=${OLIVEPRESS_DB_PASSWORD:}

# Pool reduit : adapte aux offres gratuites (Neon, Render).
spring.datasource.hikari.maximum-pool-size=${OLIVEPRESS_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Hibernate / ddl : le schema est gere par Flyway (src/main/resources/db/migration).
# "validate" garantit que les entites et la base sont synchronisees sans modification implicite.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway : migrations versionnees. baseline-on-migrate permet d'adopter Flyway
# sur une base existante (schema non vide) sans rejouer la migration initiale.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---- JWT (secrets via variables d'environnement, jamais en clair dans le code) ----
# En production (datasource non-H2), le demarrage echoue tant que ce secret n'est pas defini.
olivepress.jwt.secret=${OLIVEPRESS_JWT_SECRET:change-moi-cette-cle-secrete-en-production-64-caracteres-minimum-!!}
olivepress.jwt.expiration-ms=28800000
# Refresh token : 7 jours par defaut (rotation a chaque rafraichissement).
olivepress.jwt.refresh-expiration-ms=${OLIVEPRESS_JWT_REFRESH_MS:604800000}

# ---- CORS : origines autorisees (liste separee par des virgules, PAS de wildcard) ----
# Dev par defaut : Vite (5173) + Expo web (8081/19006). Prod : definir OLIVEPRESS_CORS_ORIGINS.
olivepress.cors.allowed-origins=${OLIVEPRESS_CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

# ---- Anti brute-force sur /api/auth/login (0 = desactive) ----
olivepress.security.login.max-attempts=${OLIVEPRESS_LOGIN_MAX_ATTEMPTS:5}
olivepress.security.login.window-minutes=${OLIVEPRESS_LOGIN_WINDOW_MINUTES:15}

# ---- Compte administrateur initial (seed) ----
olivepress.admin.username=${OLIVEPRESS_ADMIN_USER:admin}
olivepress.admin.email=${OLIVEPRESS_ADMIN_EMAIL:admin@olivepress.local}
olivepress.admin.password=${OLIVEPRESS_ADMIN_PASSWORD:admin1234}
olivepress.admin.full-name=${OLIVEPRESS_ADMIN_NAME:Administrateur OlivePress}

# Jeu de donnees de demonstration (false en production)
olivepress.seed.demo=false

# ---- Notifications push (Expo). true = envoi reel via exp.host ----
olivepress.push.enabled=${OLIVEPRESS_PUSH_ENABLED:false}
