# ============================================================
# Profil "h2" : developpement / test SANS serveur PostgreSQL.
# Lancer avec :  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================

spring.datasource.url=jdbc:h2:mem:olivepress;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Donnees de demonstration activees en dev
olivepress.seed.demo=true
