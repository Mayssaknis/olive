# ============================================================
# Blueprint Render - OlivePress API (offre gratuite)
# Deploiement : Render Dashboard -> New -> Blueprint -> repo GitHub.
# Les variables marquees sync:false sont a saisir dans le dashboard.
# ============================================================
services:
  - type: web
    name: olivepress-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Neon PostgreSQL ---
      # Format : jdbc:postgresql://<host>/<db>?sslmode=require
      - key: OLIVEPRESS_DB_URL
        sync: false
      - key: OLIVEPRESS_DB_USER
        sync: false
      - key: OLIVEPRESS_DB_PASSWORD
        sync: false
      # --- Securite ---
      - key: OLIVEPRESS_JWT_SECRET
        generateValue: true
      # --- Compte administrateur initial ---
      - key: OLIVEPRESS_ADMIN_USER
        value: admin
      - key: OLIVEPRESS_ADMIN_EMAIL
        value: admin@olivepress.local
      - key: OLIVEPRESS_ADMIN_PASSWORD
        sync: false
